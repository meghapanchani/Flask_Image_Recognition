
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pylint==3.3.9

      - name: Run Pylint
        run: |
          python -m pylint app.py model.py

      - name: Run all tests
        run: |
          python -m pytest -v
