
name: Generate Linux Dependency Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==25.0.1
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pytest-cov==6.0.0

      - name: Generate Linux lock file
        run: python -m pip freeze > requirements-linux-lock.txt

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: linux-dependency-lock
          path: requirements-linux-lock.txt
